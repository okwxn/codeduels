repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --locked ruff check --force-exclude
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format --check
        entry: uv run --locked ruff format --check --force-exclude
        language: system
        types_or: [python, pyi]
      # ty needs the whole project to resolve imports, so it checks everything,
      # but only when a Python file is part of the commit
      - id: ty
        name: ty check
        entry: uv run --locked ty check .
        language: system
        types_or: [python, pyi]
        pass_filenames: false
      # Regenerate problems/ from tracked sources and fail if that changed anything.
      # Runs on every commit (~0.3s) since pre-commit doesn't match deleted files
      - id: gen
        name: problems/ up to date
        entry: uv run --locked python tools/gen_tests.py --check
        language: system
        always_run: true
        pass_filenames: false
