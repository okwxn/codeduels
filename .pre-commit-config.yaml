repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --force-exclude
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format --check
        entry: uv run --frozen ruff format --check --force-exclude
        language: system
        types_or: [python, pyi]
      # ty needs the whole project to resolve imports, so it checks everything,
      # but only when a Python file is part of the commit
      - id: ty
        name: ty check
        entry: uv run --frozen ty check .
        language: system
        types_or: [python, pyi]
        pass_filenames: false
