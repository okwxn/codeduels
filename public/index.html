<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>CodeDuels</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚔️</text></svg>">
<style>
body{font:15px system-ui;background:#111;color:#eee;max-width:1000px;margin:0 auto;padding:16px}
input,select,button{font:inherit;padding:6px 10px;margin:2px;background:#222;color:#eee;border:1px solid #444;border-radius:6px}
button{cursor:pointer;background:#2d6cdf;border:0}
pre{white-space:pre-wrap;background:#1a1a1a;padding:10px;border-radius:6px}
#ed{height:360px;border:1px solid #333}.hide{display:none}
</style>
<h2><a href="/" style="color:inherit;text-decoration:none">CodeDuels</a></h2>

<div id=home class=hide>
  <p>No signup. Create a match, send the link.</p>
  <p>Difficulty:
    <label><input type=checkbox class=diff value=easy checked> easy</label>
    <label><input type=checkbox class=diff value=medium> medium</label>
    <label><input type=checkbox class=diff value=hard> hard</label></p>
  <p>Topics (comma-separated, blank = any): <input id=topics placeholder="two-pointers, sliding-window"></p>
  <p>Minutes: <select id=mins><option>5<option selected>10<option>15</select></p>
  <button onclick=create()>Create match</button>
</div>

<div id=room class=hide>
  <p id=players></p><p id=banner></p>
  <div id=lobby class=hide>
    <p>Send this link to your opponent:</p>
    <input id=link readonly size=40 onclick="this.select()">
  </div>
  <button id=start class=hide onclick="send('start')">Start</button>
  <div id=play class=hide>
    <h3><span id=title></span> <b id=clock></b></h3>
    <pre id=stmt></pre><div id=ed></div>
    <button onclick=submitCode()>Submit</button><pre id=res></pre>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.0/min/vs/loader.js"></script>
<script>
const $ = id => document.getElementById(id);
const uid = () => crypto.randomUUID?.() ?? (Math.random().toString(36).slice(2) + Date.now().toString(36));
const pid = localStorage.pid ||= uid();
const code = location.pathname.startsWith('/r/') ? location.pathname.slice(3) : null;
const send = t => ws.send(JSON.stringify({ type: t }));

async function create() {
  const body = {
    difficulties: [...document.querySelectorAll('.diff:checked')].map(x => x.value),
    topics: $('topics').value.split(',').map(s => s.trim()).filter(Boolean),
    minutes: +$('mins').value };
  const r = await fetch('/api/rooms', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
  const j = await r.json();
  if (!r.ok) return alert(j.error);
  location.href = '/r/' + j.code;
}

if (!code) $('home').classList.remove('hide');
else {
  $('room').classList.remove('hide');
  var myName = localStorage.myName ||= (prompt('Your name?') || 'anon').slice(0, 20);
  var ws, S, deadline = 0, editor, worker, lastRound = -1;

  const ready = new Promise(res => {
    require.config({ paths: { vs: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.52.0/min/vs' } });
    require(['vs/editor/editor.main'], () => {
      editor = monaco.editor.create($('ed'), { value: '', language: 'python', theme: 'vs-dark',
        minimap: { enabled: false }, automaticLayout: true });
      res();
    });
  });
  const setCode = async c => { await ready; editor.setValue(c); };
  const newWorker = () => (worker = new Worker('/worker.js'));
  newWorker();

  function connect() {
    ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws?room=${code}&pid=${pid}&name=${encodeURIComponent(myName)}`);
    ws.onmessage = e => {
      const m = JSON.parse(e.data);
      if (m.type === 'full') { ws.onclose = null; return $('banner').textContent = 'Room is full'; }
      S = m; deadline = Date.now() + m.remainingMs; render();
    };
    ws.onclose = () => setTimeout(connect, 1500);
  }
  connect();

  function render() {
    const isHost = S.hostId === pid;
    $('players').textContent = S.players.map(p => p.name + (p.online ? '' : ' (offline)') + (p.id === S.hostId ? ' ★' : '')).join('  vs  ');
    $('link').value = location.href;
    $('lobby').classList.toggle('hide', S.state !== 'lobby');
    $('play').classList.toggle('hide', S.state === 'lobby');
    $('start').classList.toggle('hide', !(isHost && S.players.length === 2 && S.state !== 'running'));
    $('start').textContent = S.state === 'lobby' ? 'Start' : 'Rematch';
    if (S.problem && S.round !== lastRound) {
      lastRound = S.round;
      $('title').textContent = `${S.problem.title} [${S.problem.difficulty}]`;
      $('stmt').textContent = S.problem.statement;
      $('res').textContent = '';
      setCode(S.problem.starter);
    }
    $('banner').textContent = S.state !== 'finished' ? '' :
      S.winner ? `🏆 ${S.winner.name} solved it in ${(S.winner.ms / 1000).toFixed(1)}s` : "Time's up, draw";
  }

  setInterval(() => {
    if (S?.state !== 'running') return;
    const s = Math.max(0, Math.ceil((deadline - Date.now()) / 1000));
    $('clock').textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  }, 250);

  function runTests(src, p) {
    return new Promise(res => {
      const t = setTimeout(() => { worker.terminate(); newWorker(); res({ error: 'Timed out, infinite loop?' }); }, 20000);
      worker.onmessage = e => { clearTimeout(t); res(e.data); };
      worker.postMessage({ code: src, entry: p.entry, tests: p.tests });
    });
  }
 window.submitCode = async function () {
    if (S?.state !== 'running') return;
    $('res').textContent = 'Running… (first run loads Python, takes a few secs)';
    const r = await runTests(editor.getValue(), S.problem);
    if (r.error) return $('res').textContent = 'Error: ' + r.error;
    $('res').textContent = `${r.passed}/${r.total} passed` +
      (r.fail ? `\nFailed: args=${JSON.stringify(r.fail.args)} expected=${JSON.stringify(r.fail.expected)} got=${r.fail.got}` : '');
    if (r.passed === r.total) send('solved');
  }
}
</script>
