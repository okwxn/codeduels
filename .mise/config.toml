min_version = "2026.10.1"

[tools]
python = "3.14.8"
uv = "0.13.1"

[settings]
lockfile = true
github_attestations = true
slsa = true
python.uv_venv_auto = "create|source"

[hooks]
# --locked fails loudly if uv.lock is out of date with pyproject.toml (same as CI);
# pre-commit is installed once, not on every cd
enter = """
uv sync --locked -q &&
  { [ -f "$(git rev-parse --git-path hooks/pre-commit)" ] || uv run --locked pre-commit install; }
"""
